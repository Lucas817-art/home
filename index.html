<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas 的小屋 · 个人主页</title>
<style>
  :root{
    --wall:#f4ead9;
    --wall-dark:#e8d9bf;
    --wood:#8a5a3b;
    --wood-light:#b9855c;
    --wood-dark:#5f3d26;
    --paper:#fffaf0;
    --ink:#3d2b1f;
    --accent:#c97b4a;
    --shadow:rgba(95,61,38,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, #fff6e8 0, transparent 40%),
      radial-gradient(circle at 80% 85%, #f3e2c8 0, transparent 45%),
      var(--wall);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 48px;
  }

  /* ===== 玄关 ===== */
  .house{
    width:100%;
    max-width:960px;
  }
  .roof{
    text-align:center;
    margin-bottom:8px;
  }
  .roof .gable{
    font-size:13px;letter-spacing:.5em;color:var(--wood);
    text-transform:uppercase;
  }
  .house-title{
    font-size:clamp(28px,5vw,40px);
    font-weight:800;
    color:var(--wood-dark);
    margin:6px 0 4px;
    letter-spacing:.12em;
  }
  .house-sub{
    color:#7a6248;
    font-size:15px;
  }

  .floor{
    margin-top:32px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px;
  }
  @media (max-width:680px){
    .floor{grid-template-columns:1fr;gap:20px;}
  }

  /* 房间门卡 */
  .room{
    position:relative;
    background:var(--paper);
    border:2px solid var(--wood-light);
    border-radius:22px;
    padding:28px 26px 24px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 10px 24px var(--shadow);
    transition:transform .25s ease, box-shadow .25s ease;
    overflow:hidden;
    min-height:300px;
    display:flex;
    flex-direction:column;
  }
  .room:hover{
    transform:translateY(-6px);
    box-shadow:0 18px 34px var(--shadow);
  }
  .room::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, transparent 60%, rgba(185,133,92,.12));
    pointer-events:none;
  }

  .room-icon{
    width:72px;height:72px;
    border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    font-size:36px;
    background:var(--wall-dark);
    margin-bottom:18px;
  }
  .room.office .room-icon{background:#f6e3d2;}
  .room.study  .room-icon{background:#e3ead9;}

  .room-tag{
    display:inline-block;
    font-size:12px;letter-spacing:.2em;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:999px;
    padding:3px 12px;
    margin-bottom:12px;
    align-self:flex-start;
  }
  .room-name{
    font-size:24px;font-weight:700;color:var(--wood-dark);
    margin-bottom:10px;
  }
  .room-desc{
    font-size:14px;line-height:1.8;color:#6b5742;
    flex:1;
  }
  .room-count{
    margin-top:18px;
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--wood);
  }
  .room-count b{font-size:18px;color:var(--wood-dark);}
  .door-arrow{
    margin-left:auto;
    font-size:20px;
    transition:transform .25s ease;
  }
  .room:hover .door-arrow{transform:translateX(6px);}

  /* 踢脚线 / 底部 */
  .footer-note{
    margin-top:36px;
    text-align:center;
    font-size:13px;color:#8a7358;
    line-height:1.8;
  }
</style>
</head>
<body>

<div class="house">
  <div class="roof">
    <div class="gable">My Little Home</div>
    <h1 class="house-title">Lucas 的小屋</h1>
    <p class="house-sub">推门进去，一边办公，一边读书。</p>
  </div>

  <div class="floor">
    <!-- 办公室 -->
    <a class="room office" href="office.html">
      <div class="room-icon">🏢</div>
      <span class="room-tag">WORK</span>
      <h2 class="room-name">办公室</h2>
      <p class="room-desc">
        这里摆着日常经手的 ECA 承保测算、贷款计算器、思路导图与各版本理赔处理工具，
        工作时随手开门取用。
      </p>
      <div class="room-count">
        <b>8</b> 件工具（2 件置顶）
        <span class="door-arrow">→</span>
      </div>
    </a>

    <!-- 书房 -->
    <a class="room study" href="study.html">
      <div class="room-icon">📚</div>
      <span class="room-tag">READ &amp; THINK</span>
      <h2 class="room-name">书房</h2>
      <p class="room-desc">
        推开另一扇门，放着古文品读与专题对比资料：《滕王阁序》、《盐铁论》，
        以及公私融资的横向梳理。
      </p>
      <div class="room-count">
        <b>3</b> 册笔记
        <span class="door-arrow">→</span>
      </div>
    </a>
  </div>

  <p class="footer-note">小屋一共两间：左边是办公室，右边是书房。点击门即可进入。</p>
</div>

</body>
</html>
